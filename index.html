<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Reshito Shot</title>
  <meta name="description" content="Reshito Shot (レシート, receipt) is a thermal receipt printer photobooth. Strike a pose, get printed on a random receipt.">
  <meta property="og:title" content="Reshito Shot">
  <meta property="og:description" content="A thermal receipt printer photobooth. Strike a pose, get printed on a random receipt, tear it off.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://reshito-shot.vercel.app/">
  <meta property="og:image" content="https://reshito-shot.vercel.app/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#e8e7e3">
  <script>
    // theme before first paint: light unless the visitor chose dark
    (function () { var t; try { t = localStorage.getItem('rb-theme'); } catch (e) {}
      if (t !== 'dark') t = 'light';   // light by default; dark only when chosen
      document.documentElement.dataset.theme = t; })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/booth.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- torn receipts land here -->
  <div id="board" class="board" aria-label="Printed receipts"></div>

  <header class="hud hud-top">
    <div class="brand"><i class="brand-mark"></i>Reshito Shot</div>
    <div class="hud-right">
      <a class="kofi" id="kofi" href="https://ko-fi.com/notavision" target="_blank" rel="noopener" aria-label="Support me on Ko-fi">
        <img src="https://storage.ko-fi.com/cdn/cup-border.png" alt="" width="20" height="13">
        <span class="kofi-long">Support on Ko-fi</span><span class="kofi-short">Ko-fi</span>
      </a>
      <div class="toggles" id="toggles">
        <button id="soundBtn" class="icon-btn" type="button" aria-pressed="true" aria-label="Sound" title="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.6L12.5 5.5v13l-4.9-4H4z" fill="currentColor"/><g class="i-on" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M15.6 9.2a4 4 0 0 1 0 5.6"/><path d="M18.1 6.8a7.4 7.4 0 0 1 0 10.4"/></g><g class="i-off" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></g></svg>
        </button>
        <button id="themeBtn" class="icon-btn" type="button" aria-pressed="false" aria-label="Dark mode" title="Dark mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="counter" id="counterBox" title="Prints so far, by everyone">
        <span id="flaps"></span><span class="counter-label">prints</span>
      </div>
    </div>
  </header>
  <a class="kofi-tip" id="kofiTip" href="https://ko-fi.com/notavision" target="_blank" rel="noopener" hidden>Enjoying it? Help me get a new PC <span aria-hidden="true">→</span></a>

  <main class="stage" id="stage">
    <!-- live thermal preview -->
    <div class="viewfinder" id="viewfinder">
      <canvas id="preview" class="preview" width="200" height="250"></canvas>
      <i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i><i class="crop br"></i>
      <div class="vf-count" id="countdown" aria-live="polite"></div>
      <i class="vf-scan" aria-hidden="true"></i>
      <div class="vf-empty" id="vfEmpty">
        <button class="pill pill-dark" id="startBtn" type="button">Start camera</button>
        <label class="vf-link">or upload a photo<input type="file" accept="image/*" id="fileInput" hidden></label>
        <p class="vf-note" id="vfNote"></p>
      </div>
      <div class="vf-meta" id="vfMeta">NO SIGNAL</div>
    </div>

    <!-- paper comes out of the slot inside this clipped area -->
    <div class="track" id="track"></div>

    <div class="printer" id="printer">
      <div class="lid">
        <div class="slot"><i class="slot-lip"></i></div>
        <div class="cutter"></div>
      </div>
      <div class="face">
        <div class="panel-left">
          <div class="lcd">
            <span class="lcd-1" id="lcd1">HELLO</span>
            <span class="lcd-2" id="lcd2">PRESS PRINT TO WAKE</span>
          </div>
          <div class="model"><i class="led" id="led"></i>RB-01 &nbsp;THERMAL PHOTO PRINTER</div>
        </div>
        <div class="panel-right">
          <div class="switch-wrap">
            <div class="switch" id="modeSwitch" role="radiogroup" aria-label="Print mode" data-mode="full">
              <button type="button" role="radio" data-mode="focus" aria-checked="false">Focus</button>
              <button type="button" role="radio" data-mode="full" aria-checked="true">Full</button>
              <i class="knob"></i>
            </div>
            <div class="bg-row disabled" id="bgRow">
              <span class="bg-label">BACKGROUND</span>
              <button type="button" class="mini-switch" id="bgSwitch" role="switch" aria-checked="false" aria-label="Background in focus mode"><i></i></button>
              <span class="bg-state" id="bgState">OFF</span>
            </div>
          </div>
          <div class="print-wrap">
            <div class="bezel"><button class="print-btn" id="printBtn" type="button" aria-label="Print"></button></div>
            <span class="print-label">PRINT</span>
          </div>
        </div>
      </div>
      <i class="foot l"></i><i class="foot r"></i>
    </div>
  </main>

  <footer class="hud hud-bottom">
    <span id="hint" class="hint">Space to print · F focus/full · B background</span>
    <a class="credit" id="credit" href="https://www.instagram.com/not.a.vision/" target="_blank" rel="noopener">made by NAV <span aria-hidden="true">↗</span></a>
    <div class="hud-bottom-right">
      <button id="camBtn" class="hud-btn" type="button" hidden>Use camera</button>
      <label class="hud-btn">Upload photo<input type="file" accept="image/*" id="fileInput2" hidden></label>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-inner">
      <img id="lbImg" alt="Printed receipt">
      <div class="lb-actions">
        <button id="lbSave" class="pill pill-dark" type="button">Save PNG</button>
        <button id="lbDelete" class="pill" type="button">Throw away</button>
        <button id="lbClose" class="pill" type="button">Close</button>
      </div>
      <p class="lb-note" id="lbNote"></p>
    </div>
  </div>

  <div class="flash" id="flash"></div>
  <video id="video" playsinline muted autoplay></video>
  <div id="admin" class="admin" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
